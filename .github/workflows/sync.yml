name: Sync vk.xml

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/convert.py", ".github/workflows/sync.yml"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Fetch upstream vk.xml
        id: fetch
        run: |
          SHA=$(git ls-remote https://github.com/KhronosGroup/Vulkan-Docs refs/heads/main | cut -f1)
          curl -fsSL "https://raw.githubusercontent.com/KhronosGroup/Vulkan-Docs/$SHA/xml/vk.xml" -o vk.xml
          echo "$SHA" > .github/data/UPSTREAM_COMMIT

      - name: Convert
        id: convert
        run: |
          SHA=$(cat .github/data/UPSTREAM_COMMIT)
          python .github/workflows/convert.py --input vk.xml --output vk.json --commit "$SHA"

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898332+github-actions[bot]@users.noreply.github.com"
          git add vk.json .github/data/UPSTREAM_COMMIT
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Sync Vulkan-Docs $(cut -c1-7 .github/data/UPSTREAM_COMMIT)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python -c "import json;print(json.load(open('vk.json'))['meta']['headerVersion'])")
          TAG="v1.4.$VER-$(cut -c1-7 .github/data/UPSTREAM_COMMIT)"
          gh release create "$TAG" vk.json vk.min.json \
            --title "Vulkan header $VER ($(cut -c1-7 .github/data/UPSTREAM_COMMIT))" \
            --notes "Generated from KhronosGroup/Vulkan-Docs@$(cat .github/data/UPSTREAM_COMMIT)"
